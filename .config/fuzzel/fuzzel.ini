# Fuzzel — OneDark (meniru rofi themes/onedark.rasi: bg #1f2329,
# border 3px #4e545f, selected row #4998da + teks #1f2329)
# Fuzzel native Wayland → selalu muncul di output/workspace yang sedang aktif
# (rofi build X11 tidak bisa — makanya launcher pakai fuzzel)

font=FiraCode Nerd Font:size=12
dpi-aware=no  # pixel-based: konsisten antar monitor; DPI EDID sering tidak akurat
anchor=center
width=45
lines=10
prompt=:
terminal=alacritty -e
icons-enabled=yes
horizontal-padding=20
vertical-padding=15
inner-padding=15

[colors]
background=1f2329ff
text=b2bbccff
prompt=b2bbccff
input=b2bbccff
placeholder=4e545fff
match=4998daff
selection=4998daff
selection-text=1f2329ff
selection-match=1f2329ff
counter=4e545fff
border=4e545fff

[border]
width=3
radius=0
